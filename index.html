<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Frota</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 20px;
    }

    .container {
        background: white;
        padding: 20px;
        border-radius: 12px;
        max-width: 500px;
        width: 100%;
        margin: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        box-sizing: border-box;
    }

    h2 {
        color: #007BFF; /* Azul */
        margin-bottom: 20px;
        font-size: 22px;
    }

    input {
        padding: 14px;
        width: 100%;
        font-size: 16px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    button {
        padding: 14px;
        width: 100%;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        background-color: #007BFF;
        color: white;
        cursor: pointer;
        transition: background 0.3s;
    }

    button:hover {
        background-color: #0056b3;
    }

    .resultado {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
    }

    @media (max-width: 480px) {
        h2 {
            font-size: 20px;
        }

        .container {
            padding: 15px;
        }
    }
</style>
</head>
<body>

<div class="container">
    <h2>Consulta de Frota</h2>
    <input type="text" id="placa" placeholder="Digite a placa (ex: ABC1234)">
    <button onclick="consultar()">Consultar</button>
    <div class="resultado" id="resultado"></div>
</div>
